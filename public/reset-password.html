<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Restablecer contraseña — Abyss</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #020509;
      color: #e8f4f8;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #0b1521;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    @media (max-width: 500px) {
      .card { border-radius: 0; border-left: none; border-right: none; padding: 32px 20px; min-height: 100vh; }
    }
    .logo {
      text-align: center;
      color: rgba(0,229,204,0.7);
      font-size: 11px;
      letter-spacing: 5px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    h1 {
      text-align: center;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 700;
      color: #e8f4f8;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(232,244,248,0.4);
      font-weight: 700;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #0d1d2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 13px 16px;
      color: #e8f4f8;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    input:focus { border-color: rgba(0,229,204,0.4); }
    .btn {
      width: 100%;
      box-sizing: border-box;
      background: linear-gradient(90deg, #006b63, #00e5cc);
      color: #001a18;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s;
      margin-top: 4px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .msg.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: #22c55e; }
    .msg.error   { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); color: rgba(239,68,68,0.9); }
    .hint { color: rgba(232,244,248,0.3); font-size: 12px; text-align: center; margin-top: 16px; line-height: 1.6; }
    .invalid-token { text-align: center; padding: 20px 0; }
    .invalid-token p { color: rgba(239,68,68,0.8); font-size: 15px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo">ABYSS</p>
    <h1>Nueva contraseña</h1>
    <div id="form-container">
      <label for="password">NUEVA CONTRASEÑA</label>
      <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" />
      <label for="confirm">CONFIRMAR CONTRASEÑA</label>
      <input type="password" id="confirm" placeholder="Repite la contraseña" />
      <button class="btn" id="btn" onclick="handleSubmit()">Guardar contraseña</button>
      <div class="msg" id="msg"></div>
      <p class="hint">Después de guardar serás redirigido a la app.</p>
    </div>
    <div class="invalid-token" id="invalid" style="display:none;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(239,68,68,0.7)" stroke-width="1.5" style="display:block;margin:0 auto 12px">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <p>Este enlace es inválido o ya expiró.<br>Solicita uno nuevo desde la app.</p>
    </div>
  </div>

  <script>
    const API = 'https://abyss-production-7171.up.railway.app/api';
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    if (!token) {
      document.getElementById('form-container').style.display = 'none';
      document.getElementById('invalid').style.display = 'block';
    }

    async function handleSubmit() {
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      const btn      = document.getElementById('btn');
      const msg      = document.getElementById('msg');

      msg.style.display = 'none';

      if (password.length < 6) return showMsg('La contraseña debe tener al menos 6 caracteres.', 'error');
      if (password !== confirm) return showMsg('Las contraseñas no coinciden.', 'error');

      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        const res  = await fetch(`${API}/auth/reset-password`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token, newPassword: password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al restablecer');

        showMsg('¡Contraseña actualizada! Ya puedes iniciar sesión en la app.', 'success');
        btn.style.display = 'none';
        setTimeout(() => { window.location.href = 'https://abyss.social'; }, 3000);
      } catch (e) {
        showMsg(e.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Guardar contraseña';
      }
    }

    function showMsg(text, type) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = 'msg ' + type;
      msg.style.display = 'block';
    }
  </script>
</body>
</html>
