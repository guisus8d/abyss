<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Verificar correo — Abyss</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0; padding: 0;
      min-height: 100vh;
      background: #020509;
      color: #e8f4f8;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    body { display: flex; align-items: center; justify-content: center; }
    .card {
      background: #0b1521;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 48px 32px;
      width: 100%; max-width: 460px;
      margin: 0 auto;
      text-align: center;
    }
    @media (max-width: 500px) {
      .card { border-radius: 0; border-left: none; border-right: none; padding: 40px 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    }
    .logo { color: rgba(0,229,204,0.7); font-size: 11px; letter-spacing: 5px; font-weight: 700; margin-bottom: 32px; }
    .icon { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 36px; }
    .icon.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); }
    .icon.error   { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); }
    .icon.loading { background: rgba(0,229,204,0.08); border: 1px solid rgba(0,229,204,0.2); animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.5 } }
    h1 { font-size: clamp(18px, 5vw, 24px); font-weight: 700; margin-bottom: 12px; }
    p  { color: rgba(232,244,248,0.5); font-size: 14px; line-height: 1.7; margin-bottom: 8px; }
    .btn {
      display: inline-block; margin-top: 28px;
      background: linear-gradient(90deg, #006b63, #00e5cc);
      color: #001a18; font-weight: 800; font-size: 14px;
      padding: 13px 32px; border-radius: 12px;
      text-decoration: none; letter-spacing: 0.5px;
    }
    .footer { margin-top: 32px; color: rgba(232,244,248,0.2); font-size: 11px; }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo">ABYSS</p>
    <div class="icon loading" id="icon">⌛</div>
    <h1 id="title">Verificando...</h1>
    <p id="msg">Por favor espera un momento.</p>
    <div id="action"></div>
    <p class="footer">© 2025 Abyss · abyss.social</p>
  </div>

  <script>
    const API = 'https://abyss-production-7171.up.railway.app/api';
    const token = new URLSearchParams(window.location.search).get('token');

    async function verify() {
      const icon  = document.getElementById('icon');
      const title = document.getElementById('title');
      const msg   = document.getElementById('msg');
      const action = document.getElementById('action');

      if (!token) {
        icon.className = 'icon error'; icon.textContent = '✕';
        title.textContent = 'Enlace inválido';
        msg.textContent = 'Este enlace de verificación no es válido.';
        return;
      }

      try {
        const res  = await fetch(`${API}/auth/verify-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Error al verificar');

        icon.className = 'icon success'; icon.textContent = '✓';
        title.textContent = '¡Correo verificado!';
        msg.innerHTML = 'Tu cuenta de <strong style="color:#e8f4f8">Abyss</strong> ha sido verificada correctamente.';
        action.innerHTML = '<a href="https://abyss.social" class="btn">Volver a Abyss</a>';
      } catch (e) {
        icon.className = 'icon error'; icon.textContent = '✕';
        title.textContent = 'No se pudo verificar';
        msg.textContent = e.message;
      }
    }

    verify();
  </script>
</body>
</html>
