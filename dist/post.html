<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Post · Abyss</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#020509;--s1:#0b1521;--s2:#0d1d2e;--border:rgba(255,255,255,0.07);
      --accent:#00e5cc;--hi:#e6f0ff;--mid:rgba(230,240,255,.65);--dim:rgba(230,240,255,.35);
    }
    html{background:var(--bg);color:var(--mid);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.6}
    body{min-height:100vh}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

    .bar{background:rgba(0,229,204,0.05);border-bottom:1px solid var(--border);padding:13px 20px;display:flex;align-items:center;gap:10px}
    .logo-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
    .logo{color:var(--accent);font-weight:900;font-size:16px;letter-spacing:3px}

    .wrap{max-width:600px;margin:28px auto;padding:0 16px 40px}

    .card{background:var(--s1);border:1px solid var(--border);border-radius:16px;overflow:hidden}

    .author-row{display:flex;align-items:center;gap:12px;padding:18px 20px 0}
    .av{width:44px;height:44px;border-radius:22px;background:rgba(0,229,204,.12);border:1px solid rgba(0,229,204,.25);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:18px;font-weight:800;color:var(--accent)}
    .av img{width:100%;height:100%;object-fit:cover}
    .uname{color:var(--hi);font-weight:700;font-size:14px}
    .meta{color:var(--dim);font-size:11px;margin-top:1px}

    .body{padding:14px 20px 18px}
    .text{color:var(--hi);font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
    .img{width:100%;max-height:480px;object-fit:cover;display:block;border-radius:10px;margin-top:12px}

    .footer{border-top:1px solid var(--border);padding:12px 20px;display:flex;gap:20px;color:var(--dim);font-size:13px}

    .btn-wrap{text-align:center;margin:22px 0}
    .btn{display:inline-block;padding:12px 30px;background:linear-gradient(90deg,#006b63,#00e5cc);color:#001a18;font-weight:800;font-size:14px;border-radius:12px;text-decoration:none}

    .center{display:flex;align-items:center;justify-content:center;min-height:40vh;color:var(--dim);font-size:14px}
    .spin{width:28px;height:28px;border:2px solid rgba(0,229,204,.25);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading{text-align:center;padding:60px 20px}
  </style>
</head>
<body>
  <div class="bar"><div class="logo-dot"></div><span class="logo">ABYSS</span></div>
  <div class="wrap" id="app">
    <div class="loading"><div class="spin"></div><p style="color:var(--dim)">Cargando post…</p></div>
  </div>

  <script>
    const API = 'https://abyss-production-7171.up.railway.app/api';

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function timeAgo(date) {
      const m = Math.floor((Date.now() - new Date(date)) / 60000);
      if (m < 1) return 'ahora';
      if (m < 60) return m + 'm';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h';
      return Math.floor(h / 24) + 'd';
    }

    async function load() {
      const id = window.location.pathname.split('/').filter(Boolean).pop();
      if (!id) { show404('ID de post no encontrado'); return; }

      try {
        const r = await fetch(`${API}/posts/${id}`);
        if (!r.ok) { show404('Post no encontrado o eliminado'); return; }
        const { post } = await r.json();
        render(post);
      } catch {
        show404('Error al cargar el post');
      }
    }

    function render(p) {
      const a = p.author || {};
      document.title = `Post de ${a.username || 'Abyss'} · Abyss`;

      const avHtml = a.avatarUrl
        ? `<img src="${esc(a.avatarUrl)}" alt="${esc(a.username)}"/>`
        : (a.username || '?')[0].toUpperCase();

      const likes    = (p.reactions || []).filter(r => r.type === 'like').length;
      const comments = (p.comments  || []).length;
      const imgHtml  = p.imageUrl ? `<img class="img" src="${esc(p.imageUrl)}" alt=""/>` : '';

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="author-row">
            <div class="av">${avHtml}</div>
            <div>
              <div class="uname">${esc(a.username || 'Usuario')}</div>
              <div class="meta">${timeAgo(p.createdAt)}</div>
            </div>
          </div>
          <div class="body">
            ${p.text ? `<p class="text">${esc(p.text)}</p>` : ''}
            ${imgHtml}
          </div>
          <div class="footer">
            <span>❤️ ${likes}</span>
            <span>💬 ${comments}</span>
          </div>
        </div>
        <div class="btn-wrap">
          <a class="btn" href="abyss://post/${esc(p._id)}">Abrir en Abyss</a>
        </div>`;
    }

    function show404(msg) {
      document.getElementById('app').innerHTML =
        `<div class="center">${esc(msg)}</div>`;
    }

    load();
  </script>
</body>
</html>
