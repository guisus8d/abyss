<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Abyss — Moderación</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#020509;--s1:#0b1521;--s2:#0d1d2e;--border:rgba(255,255,255,0.07);
      --accent:#00e5cc;--red:#ef4444;--gold:#fbbf24;--purple:#a78bfa;
      --hi:#e6f0ff;--mid:rgba(230,240,255,.65);--dim:rgba(230,240,255,.35);
      --red-bg:rgba(239,68,68,.08);--red-border:rgba(239,68,68,.25);
      --green-bg:rgba(0,229,204,.08);--green-border:rgba(0,229,204,.25);
    }
    html{background:var(--bg);color:var(--mid);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.6}
    body{min-height:100vh}

    /* ── Scrollbar ── */
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

    /* ── Login ── */
    #login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .login-card{background:var(--s1);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:400px}
    .login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
    .login-logo svg{color:var(--red)}
    .login-logo span{font-size:15px;font-weight:900;letter-spacing:4px;color:var(--red)}
    .login-title{color:var(--hi);font-size:20px;font-weight:700;margin-bottom:6px}
    .login-sub{color:var(--dim);font-size:12px;margin-bottom:28px}
    .field{margin-bottom:14px}
    .field label{display:block;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:1.5px;margin-bottom:7px}
    .field input{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--hi);font-size:14px;outline:none;transition:border-color .2s}
    .field input:focus{border-color:rgba(0,229,204,.4)}
    .btn-primary{width:100%;padding:13px;border-radius:10px;background:var(--accent);color:#001a18;font-weight:800;font-size:14px;border:none;cursor:pointer;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary:hover{opacity:.85}
    .btn-primary:disabled{opacity:.35;cursor:not-allowed}
    #login-err{color:var(--red);font-size:12px;margin-top:12px;text-align:center;min-height:18px}

    /* ── App shell ── */
    #app{display:none;min-height:100vh}
    header{position:sticky;top:0;z-index:200;background:rgba(2,5,9,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(239,68,68,.15);display:flex;align-items:center;gap:14px;padding:0 24px;height:56px}
    .h-logo{display:flex;align-items:center;gap:8px}
    .h-logo svg{color:var(--red)}
    .h-logo span{font-size:13px;font-weight:900;letter-spacing:4px;color:var(--red)}
    .h-badge{background:var(--red);color:#fff;font-size:9px;font-weight:900;padding:2px 8px;border-radius:20px;display:none}
    .h-user{margin-left:auto;color:var(--dim);font-size:12px;display:flex;align-items:center;gap:8px}
    .h-role{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:var(--gold);font-size:9px;font-weight:800;letter-spacing:1px;padding:2px 8px;border-radius:20px}
    .h-logout{background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;transition:all .2s;display:flex;align-items:center;gap:6px}
    .h-logout:hover{border-color:var(--red-border);color:var(--red)}

    .wrap{max-width:1060px;margin:0 auto;padding:28px 24px}

    /* ── Tabs ── */
    .tabs{display:flex;gap:6px;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:5px;width:fit-content;margin-bottom:24px}
    .tab{padding:8px 18px;border-radius:8px;border:none;background:none;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s}
    .tab.on{background:rgba(255,255,255,.07);color:var(--hi)}
    .tab-pip{background:var(--red);color:#fff;font-size:9px;font-weight:900;padding:1px 6px;border-radius:20px;display:none}

    /* ── Stats ── */
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
    .stat{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:18px 16px;text-align:center;cursor:pointer;transition:border-color .2s}
    .stat:hover,.stat.on{border-color:var(--accent)}
    .stat-n{font-size:26px;font-weight:800;color:var(--hi)}
    .stat-l{font-size:9px;letter-spacing:2px;color:var(--dim);margin-top:4px}

    /* ── Search ── */
    .search{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:16px}
    .search svg{color:var(--dim);flex-shrink:0}
    .search input{background:none;border:none;outline:none;color:var(--hi);font-size:14px;flex:1}

    /* ── List ── */
    .list{background:var(--s1);border:1px solid var(--border);border-radius:14px;overflow:hidden}
    .row{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--border);transition:background .15s;cursor:default}
    .row:last-child{border-bottom:none}
    .row:hover{background:rgba(255,255,255,.02)}
    .row.banned-row{background:rgba(239,68,68,.03)}
    .row.clickable{cursor:pointer}

    /* ── Avatar ── */
    .av{width:36px;height:36px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:13px;overflow:hidden;flex-shrink:0}
    .av img{width:100%;height:100%;object-fit:cover}

    /* ── Row info ── */
    .ri{flex:1;min-width:0}
    .rn{color:var(--hi);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .rs{color:var(--dim);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* ── Badges ── */
    .badge{display:inline-flex;align-items:center;gap:4px;font-size:8px;font-weight:800;letter-spacing:.8px;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
    .b-admin{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
    .b-mod{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3);color:var(--gold)}
    .b-user{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:var(--dim)}
    .b-banned{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
    .b-post{background:var(--green-bg);border-color:var(--green-border);color:var(--accent)}
    .b-usert{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3);color:var(--gold)}
    .b-group{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.3);color:var(--purple)}
    .b-pending{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
    .b-reviewed{background:var(--green-bg);border-color:var(--green-border);color:var(--accent)}
    .b-dismissed{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:var(--dim)}

    /* ── Action buttons ── */
    .acts{display:flex;gap:5px;flex-shrink:0}
    .act{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--dim);transition:all .2s}
    .act:hover{border-color:rgba(0,229,204,.4);color:var(--accent)}
    .act.red:hover{border-color:var(--red-border);color:var(--red);background:var(--red-bg)}
    .act.green:hover{border-color:var(--green-border);color:var(--accent)}

    /* ── Empty ── */
    .empty{text-align:center;padding:60px 20px;color:var(--dim)}
    .empty svg{margin-bottom:14px;opacity:.4}
    .empty p{font-size:14px}

    /* ── Modal ── */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:500;opacity:0;pointer-events:none;transition:opacity .2s}
    .overlay.open{opacity:1;pointer-events:all}
    .modal{background:var(--s1);border:1px solid var(--border);border-radius:18px;padding:24px;width:100%;max-width:480px;transform:translateY(12px);transition:transform .2s}
    .overlay.open .modal{transform:translateY(0)}
    .modal-title{color:var(--hi);font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
    .detail-row{display:flex;gap:12px;margin-bottom:10px;font-size:13px}
    .detail-lbl{color:var(--dim);width:110px;flex-shrink:0;font-size:12px}
    .detail-val{color:var(--hi)}
    .modal textarea,.modal input[type=text]{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--hi);font-size:13px;outline:none;resize:vertical;font-family:inherit;transition:border-color .2s}
    .modal textarea:focus,.modal input[type=text]:focus{border-color:rgba(0,229,204,.4)}
    .modal-evidence{width:100%;border-radius:10px;object-fit:cover;max-height:220px;margin-top:10px;border:1px solid var(--border)}
    .modal-actions{display:flex;gap:10px;margin-top:16px}
    .btn-dismiss{flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--dim);cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
    .btn-dismiss:hover{border-color:var(--red-border);color:var(--red)}
    .btn-resolve{flex:1;padding:11px;border-radius:10px;border:none;background:rgba(0,229,204,.8);color:#001a18;cursor:pointer;font-size:13px;font-weight:800;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:6px}
    .btn-resolve:hover{opacity:.85}
    .btn-cancel{padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--dim);cursor:pointer;font-size:13px;transition:all .2s}
    .btn-cancel:hover{color:var(--hi)}
    .btn-ban-c{flex:1;padding:11px;border-radius:10px;border:none;background:rgba(239,68,68,.8);color:#fff;cursor:pointer;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
    .divider{height:1px;background:var(--border);margin:14px 0}

    /* ── Loader ── */
    #loader{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center}
    #loader.on{display:flex}
    .spin{width:34px;height:34px;border:3px solid rgba(0,229,204,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:640px){
      .stats{grid-template-columns:repeat(3,1fr)}
      .stat-n{font-size:20px}
      .h-user .h-role,.h-user>span:first-child{display:none}
      header{padding:0 16px}
      .wrap{padding:20px 14px}
    }
  </style>
</head>
<body>

<div id="loader"><div class="spin"></div></div>

<!-- ══ LOGIN ══ -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>MOD PANEL</span>
    </div>
    <p class="login-title">Bienvenido</p>
    <p class="login-sub">Acceso restringido — solo moderadores y administradores</p>
    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="f-email" placeholder="tu@correo.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="f-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/>
    </div>
    <button class="btn-primary" id="login-btn" onclick="login()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Entrar
    </button>
    <p id="login-err"></p>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <header>
    <div class="h-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>MOD PANEL</span>
    </div>
    <span id="h-badge" class="h-badge"></span>
    <div class="h-user">
      <span id="h-uname"></span>
      <span id="h-role" class="h-role"></span>
      <button class="h-logout" onclick="logout()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Salir
      </button>
    </div>
  </header>

  <div class="wrap">
    <div class="tabs">
      <button class="tab on" id="t-rep" onclick="showTab('reports')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        Reportes
        <span class="tab-pip" id="t-pip"></span>
      </button>
      <button class="tab" id="t-usr" onclick="showTab('users')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Usuarios
      </button>
    </div>

    <!-- REPORTES -->
    <div id="pane-reports">
      <div class="stats">
        <div class="stat on" id="s-pending"   onclick="setFilter('pending')">  <div class="stat-n" id="c-pending"   style="color:var(--red)">0</div><div class="stat-l">PENDIENTES</div></div>
        <div class="stat"    id="s-reviewed"  onclick="setFilter('reviewed')"> <div class="stat-n" id="c-reviewed"  style="color:var(--accent)">0</div><div class="stat-l">REVISADOS</div></div>
        <div class="stat"    id="s-dismissed" onclick="setFilter('dismissed')"><div class="stat-n" id="c-dismissed">0</div><div class="stat-l">DESESTIMADOS</div></div>
      </div>
      <div id="rep-list"></div>
    </div>

    <!-- USUARIOS -->
    <div id="pane-users" style="display:none">
      <div class="stats">
        <div class="stat"><div class="stat-n" id="u-total">—</div><div class="stat-l">USUARIOS</div></div>
        <div class="stat"><div class="stat-n" id="u-banned" style="color:var(--red)">—</div><div class="stat-l">BANEADOS</div></div>
        <div class="stat"><div class="stat-n" id="u-mods" style="color:var(--gold)">—</div><div class="stat-l">MODS</div></div>
      </div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="u-search" placeholder="Buscar por nombre de usuario..." oninput="debouncedSearch(this.value)"/>
      </div>
      <div id="usr-list"></div>
    </div>
  </div>
</div>

<!-- Modal: reporte -->
<div class="overlay" id="m-report" onclick="closeModal('m-report')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
      Detalle del reporte
    </div>
    <div id="m-rep-body"></div>
    <div class="divider"></div>
    <label style="color:var(--dim);font-size:11px;font-weight:700;letter-spacing:1px;display:block;margin-bottom:7px">NOTAS DE MODERACIÓN</label>
    <textarea id="m-notes" rows="3" placeholder="Observaciones internas (opcional)..."></textarea>
    <div class="modal-actions">
      <button class="btn-dismiss" onclick="resolveReport('dismissed')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Desestimar
      </button>
      <button class="btn-resolve" onclick="resolveReport('reviewed')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Acción tomada
      </button>
    </div>
    <div style="margin-top:10px"><button class="btn-cancel" onclick="closeModal('m-report')">Cancelar</button></div>
  </div>
</div>

<!-- Modal: banear -->
<div class="overlay" id="m-ban" onclick="closeModal('m-ban')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      Banear usuario
    </div>
    <p id="m-ban-user" style="color:var(--dim);margin-bottom:16px;font-size:13px"></p>
    <label style="color:var(--dim);font-size:11px;font-weight:700;letter-spacing:1px;display:block;margin-bottom:7px">MOTIVO</label>
    <input type="text" id="m-ban-reason" placeholder="Describe el motivo del ban..."/>
    <div class="modal-actions" style="margin-top:14px">
      <button class="btn-cancel" onclick="closeModal('m-ban')">Cancelar</button>
      <button class="btn-ban-c" onclick="confirmBan()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
        Confirmar ban
      </button>
    </div>
  </div>
</div>

<script>
const API='https://abyss-production-7171.up.railway.app/api';
let tok=localStorage.getItem('mod_tok')||'';
let me=null,reportFilter='pending',activeReport=null,banTarget=null,srchTimer=null;
const REASONS={spam:'Spam',hate:'Discurso de odio',harassment:'Acoso o bullying',violence:'Contenido violento',nsfw:'Contenido inapropiado',misinformation:'Desinformación',other:'Otro'};
const TYPE_BADGE={post:'<span class="badge b-post">POST</span>',user:'<span class="badge b-usert">USUARIO</span>',group:'<span class="badge b-group">GRUPO</span>'};
const STATUS_BADGE={pending:'<span class="badge b-pending">PENDIENTE</span>',reviewed:'<span class="badge b-reviewed">REVISADO</span>',dismissed:'<span class="badge b-dismissed">DESESTIMADO</span>'};

// SVG icons inline
const ICO={
  search:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  ban:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>`,
  unban:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  shield:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
  profile:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
  chevron:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`,
};

function load(on){document.getElementById('loader').classList.toggle('on',on)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fdate(d){return new Date(d).toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}

async function req(path,opts={}){
  const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',Authorization:`Bearer ${tok}`,...(opts.headers||{})},body:opts.body?JSON.stringify(opts.body):undefined});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Error');
  return d;
}

// ── Auth ──────────────────────────────────────────────────────────────────────
async function login(){
  const e=document.getElementById('f-email').value.trim();
  const p=document.getElementById('f-pass').value;
  const err=document.getElementById('login-err');
  err.textContent='';
  if(!e||!p){err.textContent='Completa los campos';return}
  const btn=document.getElementById('login-btn');
  btn.disabled=true;load(true);
  try{
    const d=await req('/auth/login',{method:'POST',body:{email:e,password:p}});
    if(d.user?.role!=='mod'&&d.user?.role!=='admin'){err.textContent='Sin permisos de moderación';return}
    tok=d.token;me=d.user;
    localStorage.setItem('mod_tok',tok);
    showApp();
  }catch(ex){err.textContent=ex.message}
  finally{btn.disabled=false;load(false)}
}

async function verifyTok(){
  if(!tok)return false;
  try{const d=await req('/users/me');me=d.user;return me?.role==='mod'||me?.role==='admin'}
  catch{return false}
}

function logout(){tok='';me=null;localStorage.removeItem('mod_tok');document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex'}

function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('h-uname').textContent=`@${me?.username}`;
  document.getElementById('h-role').textContent=(me?.role||'').toUpperCase();
  loadReports();
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function showTab(t){
  document.getElementById('pane-reports').style.display=t==='reports'?'block':'none';
  document.getElementById('pane-users').style.display=t==='users'?'block':'none';
  document.getElementById('t-rep').classList.toggle('on',t==='reports');
  document.getElementById('t-usr').classList.toggle('on',t==='users');
  if(t==='users')loadUsers();
}

// ── Reports ───────────────────────────────────────────────────────────────────
function setFilter(f){
  reportFilter=f;
  ['pending','reviewed','dismissed'].forEach(s=>{
    document.getElementById('s-'+s).classList.toggle('on',s===f);
  });
  loadReports();
}

async function loadReports(){
  const el=document.getElementById('rep-list');
  el.innerHTML='<div class="empty"><div class="spin" style="margin:auto"></div></div>';
  try{
    const d=await req(`/reports?status=${reportFilter}`);
    document.getElementById('c-pending').textContent=d.pending;
    document.getElementById('c-reviewed').textContent=d.reviewed;
    document.getElementById('c-dismissed').textContent=d.dismissed;
    const pip=document.getElementById('t-pip'),hb=document.getElementById('h-badge');
    if(d.pending>0){pip.textContent=d.pending;pip.style.display='inline';hb.textContent=d.pending;hb.style.display='inline'}
    else{pip.style.display='none';hb.style.display='none'}
    window._reps=d.reports||[];
    if(!d.reports.length){el.innerHTML=`<div class="empty"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg><p>Sin reportes ${reportFilter==='pending'?'pendientes':reportFilter==='reviewed'?'revisados':'desestimados'}</p></div>`;return}
    el.innerHTML='<div class="list">'+d.reports.map(r=>`
      <div class="row clickable" onclick="openReport('${r._id}')">
        ${TYPE_BADGE[r.type]||''}
        <div class="ri">
          <div class="rn">${esc(r.targetName||r.targetId)}</div>
          <div class="rs">${esc(REASONS[r.reason]||r.reason)} &middot; @${esc(r.reporter?.username||'?')} &middot; ${fdate(r.createdAt)}</div>
        </div>
        ${STATUS_BADGE[r.status]||''}
        ${ICO.chevron}
      </div>
    `).join('')+'</div>';
  }catch(ex){el.innerHTML=`<div class="empty"><p style="color:var(--red)">${esc(ex.message)}</p></div>`}
}

function openReport(id){
  const r=(window._reps||[]).find(x=>x._id===id);
  if(!r)return;
  activeReport=id;
  const tc=TYPE_BADGE[r.type]||'',sc=STATUS_BADGE[r.status]||'';
  document.getElementById('m-rep-body').innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px">${tc}<strong style="color:var(--hi)">${esc(r.targetName||r.targetId)}</strong>${sc}</div>
    <div class="detail-row"><span class="detail-lbl">Reportado por</span><span class="detail-val">@${esc(r.reporter?.username||'?')}</span></div>
    <div class="detail-row"><span class="detail-lbl">Motivo</span><span class="detail-val">${esc(REASONS[r.reason]||r.reason)}</span></div>
    ${r.details?`<div class="detail-row"><span class="detail-lbl">Detalles</span><span class="detail-val">${esc(r.details)}</span></div>`:''}
    <div class="detail-row"><span class="detail-lbl">Fecha</span><span class="detail-val">${fdate(r.createdAt)}</span></div>
    ${r.resolvedBy?`<div class="detail-row"><span class="detail-lbl">Resuelto por</span><span class="detail-val">@${esc(r.resolvedBy?.username||'?')}</span></div>`:''}
    ${r.imageUrl?`<img src="${esc(r.imageUrl)}" class="modal-evidence" alt="Evidencia adjunta"/>`:''}
  `;
  document.getElementById('m-notes').value=r.modNotes||'';
  openModal('m-report');
}

async function resolveReport(status){
  if(!activeReport)return;
  load(true);
  try{await req(`/reports/${activeReport}`,{method:'PATCH',body:{status,modNotes:document.getElementById('m-notes').value}});closeModal('m-report');loadReports()}
  catch(ex){alert(ex.message)}
  finally{load(false)}
}

// ── Users ─────────────────────────────────────────────────────────────────────
async function loadUsers(q=''){
  const el=document.getElementById('usr-list');
  el.innerHTML='<div class="empty"><div class="spin" style="margin:auto"></div></div>';
  try{
    const d=await req(`/users/mod/users${q?`?q=${encodeURIComponent(q)}`:''}`);
    const u=d.users||[];
    document.getElementById('u-total').textContent=u.length;
    document.getElementById('u-banned').textContent=u.filter(x=>x.banned).length;
    document.getElementById('u-mods').textContent=u.filter(x=>x.role==='mod'||x.role==='admin').length;
    if(!u.length){el.innerHTML='<div class="empty"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><p>Sin usuarios</p></div>';return}
    el.innerHTML='<div class="list">'+u.map(x=>`
      <div class="row ${x.banned?'banned-row':''}">
        <div class="av">${x.avatarUrl?`<img src="${esc(x.avatarUrl)}" loading="lazy"/>`:(x.username?.[0]?.toUpperCase()||'?')}</div>
        <div class="ri">
          <div class="rn" style="${x.banned?'text-decoration:line-through;opacity:.5':''}">
            @${esc(x.username)}
            <span class="badge b-${x.role}">${x.role.toUpperCase()}</span>
            ${x.banned?'<span class="badge b-banned">BANEADO</span>':''}
          </div>
          <div class="rs">${esc(x.email)}${x.banned&&x.bannedReason?' &middot; '+esc(x.bannedReason):''}</div>
        </div>
        <div class="acts">
          ${x.role!=='admin'?(x.banned
            ?`<button class="act green" title="Desbanear" onclick="unban('${x._id}')">${ICO.unban}</button>`
            :`<button class="act red" title="Banear" onclick="openBan('${x._id}','${esc(x.username)}')">${ICO.ban}</button>`
          ):''}
          ${me?.role==='admin'&&x.role!=='admin'?`<button class="act" title="${x.role==='mod'?'Quitar mod':'Hacer mod'}" onclick="setrole('${x._id}','${x.role==='mod'?'user':'mod'}')">${ICO.shield}</button>`:''}
          <button class="act" title="Ver perfil" onclick="window.open('https://abyss.social/@${esc(x.username)}','_blank')">${ICO.profile}</button>
        </div>
      </div>
    `).join('')+'</div>';
  }catch(ex){el.innerHTML=`<div class="empty"><p style="color:var(--red)">${esc(ex.message)}</p></div>`}
}

function debouncedSearch(v){clearTimeout(srchTimer);srchTimer=setTimeout(()=>loadUsers(v),300)}

function openBan(id,name){banTarget=id;document.getElementById('m-ban-user').textContent=`Se aplicará un ban permanente a @${name}`;document.getElementById('m-ban-reason').value='';openModal('m-ban');setTimeout(()=>document.getElementById('m-ban-reason').focus(),80)}

async function confirmBan(){
  const reason=document.getElementById('m-ban-reason').value.trim();
  if(!reason){alert('Escribe un motivo');return}
  load(true);
  try{await req(`/users/mod/ban/${banTarget}`,{method:'POST',body:{reason}});closeModal('m-ban');loadUsers(document.getElementById('u-search').value)}
  catch(ex){alert(ex.message)}
  finally{load(false)}
}

async function unban(id){
  load(true);
  try{await req(`/users/mod/unban/${id}`,{method:'POST'});loadUsers(document.getElementById('u-search').value)}
  catch(ex){alert(ex.message)}
  finally{load(false)}
}

async function setrole(id,role){
  load(true);
  try{await req(`/users/mod/setrole/${id}`,{method:'POST',body:{role}});loadUsers(document.getElementById('u-search').value)}
  catch(ex){alert(ex.message)}
  finally{load(false)}
}

// ── Modals ────────────────────────────────────────────────────────────────────
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal('m-report');closeModal('m-ban')}});

// ── Init ──────────────────────────────────────────────────────────────────────
(async()=>{
  if(!tok)return;
  load(true);
  const ok=await verifyTok();
  load(false);
  if(ok)showApp();
  else localStorage.removeItem('mod_tok');
})();
</script>
</body>
</html>
