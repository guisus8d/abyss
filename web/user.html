<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Perfil · Abyss</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#020509;--s1:#0b1521;--s2:#0d1d2e;--border:rgba(255,255,255,0.07);
      --accent:#00e5cc;--hi:#e6f0ff;--mid:rgba(230,240,255,.65);--dim:rgba(230,240,255,.35);
    }
    html{background:var(--bg);color:var(--mid);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.6}
    body{min-height:100vh}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

    .bar{background:rgba(0,229,204,0.05);border-bottom:1px solid var(--border);padding:13px 20px;display:flex;align-items:center;gap:10px}
    .logo-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
    .logo{color:var(--accent);font-weight:900;font-size:16px;letter-spacing:3px}

    .wrap{max-width:600px;margin:28px auto;padding:0 16px 40px}

    .card{background:var(--s1);border:1px solid var(--border);border-radius:16px;overflow:hidden}

    .profile-head{text-align:center;padding:28px 20px 0}
    .av{width:72px;height:72px;border-radius:36px;background:rgba(0,229,204,.12);border:1px solid rgba(0,229,204,.25);display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 auto 12px;font-size:28px;font-weight:800;color:var(--accent)}
    .av img{width:100%;height:100%;object-fit:cover}
    .uname{color:var(--hi);font-weight:700;font-size:17px}
    .display{color:var(--dim);font-size:12px;margin-top:3px}
    .xp{color:var(--accent);font-size:12px;font-weight:700;margin-top:6px}
    .bio{color:var(--mid);font-size:13px;line-height:1.55;padding:12px 20px 0;text-align:center}

    .stats{display:flex;justify-content:space-around;padding:18px 0;margin-top:14px;border-top:1px solid var(--border)}
    .stat-val{color:var(--hi);font-size:20px;font-weight:800;display:block;text-align:center}
    .stat-lbl{color:var(--dim);font-size:11px;display:block;text-align:center;margin-top:2px}

    .posts-title{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:1.5px;padding:14px 20px 8px;border-top:1px solid var(--border);margin-top:4px}

    .post-row{display:flex;gap:12px;padding:12px 20px;border-top:1px solid var(--border);text-decoration:none;cursor:pointer}
    .post-row:hover{background:rgba(255,255,255,.02)}
    .post-thumb{width:54px;height:54px;border-radius:8px;object-fit:cover;flex-shrink:0}
    .post-preview{color:var(--mid);font-size:13px;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:1;align-self:center}
    .post-meta{color:var(--dim);font-size:11px;margin-top:3px}

    .btn-wrap{text-align:center;margin:22px 0}
    .btn{display:inline-block;padding:12px 30px;background:linear-gradient(90deg,#006b63,#00e5cc);color:#001a18;font-weight:800;font-size:14px;border-radius:12px;text-decoration:none}

    .center{display:flex;align-items:center;justify-content:center;min-height:40vh;color:var(--dim);font-size:14px}
    .spin{width:28px;height:28px;border:2px solid rgba(0,229,204,.25);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading{text-align:center;padding:60px 20px}
  </style>
</head>
<body>
  <div class="bar"><div class="logo-dot"></div><span class="logo">ABYSS</span></div>
  <div class="wrap" id="app">
    <div class="loading"><div class="spin"></div><p style="color:var(--dim)">Cargando perfil…</p></div>
  </div>

  <script>
    const API = 'https://abyss-production-7171.up.railway.app/api';

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function timeAgo(date) {
      const m = Math.floor((Date.now() - new Date(date)) / 60000);
      if (m < 1) return 'ahora';
      if (m < 60) return m + 'm';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h';
      return Math.floor(h / 24) + 'd';
    }

    async function load() {
      const username = window.location.pathname.split('/').filter(Boolean).pop();
      if (!username) { show404('Usuario no especificado'); return; }

      try {
        const [userRes, postsRes] = await Promise.all([
          fetch(`${API}/users/${username}`),
          fetch(`${API}/posts/user/${username}?limit=6`),
        ]);

        if (!userRes.ok) { show404('Usuario no encontrado'); return; }
        const { user }  = await userRes.json();
        const postsData = postsRes.ok ? await postsRes.json() : { posts: [] };

        render(user, postsData.posts || []);
      } catch {
        show404('Error al cargar el perfil');
      }
    }

    function render(u, posts) {
      document.title = `${u.username} · Abyss`;

      const avHtml = u.avatarUrl
        ? `<img src="${esc(u.avatarUrl)}" alt="${esc(u.username)}"/>`
        : (u.username || '?')[0].toUpperCase();

      const bioHtml = u.bio ? `<p class="bio">${esc(u.bio)}</p>` : '';

      const postsHtml = posts.length ? `
        <p class="posts-title">POSTS RECIENTES</p>
        ${posts.map(p => {
          const likes = (p.reactions || []).filter(r => r.type === 'like').length;
          const preview = (p.text || '').slice(0, 120) + (p.text?.length > 120 ? '…' : '');
          const thumb = p.imageUrl ? `<img class="post-thumb" src="${esc(p.imageUrl)}" alt=""/>` : '';
          return `<a class="post-row" href="/post/${p._id}">
            ${thumb}
            <div style="flex:1;min-width:0">
              ${preview ? `<p class="post-preview">${esc(preview)}</p>` : '<p class="post-preview" style="color:var(--dim);font-style:italic">Post sin texto</p>'}
              <p class="post-meta">❤️ ${likes} · 💬 ${(p.comments||[]).length} · ${timeAgo(p.createdAt)}</p>
            </div>
          </a>`;
        }).join('')}` : '';

      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="profile-head">
            <div class="av">${avHtml}</div>
            <div class="uname">${esc(u.username)}</div>
            ${u.displayName ? `<div class="display">${esc(u.displayName)}</div>` : ''}
            <div class="xp">XP ${u.xp || 0}</div>
          </div>
          ${bioHtml}
          <div class="stats">
            <div><span class="stat-val">${(u.followers||[]).length}</span><span class="stat-lbl">seguidores</span></div>
            <div><span class="stat-val">${(u.following||[]).length}</span><span class="stat-lbl">siguiendo</span></div>
          </div>
          ${postsHtml}
        </div>
        <div class="btn-wrap">
          <a class="btn" href="abyss://user/${esc(u.username)}">Abrir en Abyss</a>
        </div>`;
    }

    function show404(msg) {
      document.getElementById('app').innerHTML =
        `<div class="center">${esc(msg)}</div>`;
    }

    load();
  </script>
</body>
</html>
