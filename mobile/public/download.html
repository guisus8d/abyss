<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Abyss — Descargar APK</title>
  <meta name="description" content="Descarga la beta de Abyss Social para Android. La red social que te conecta de verdad.">
  <style>
    :root {
      --bg:        #020509;
      --teal:      #00e5cc;
      --teal-dim:  rgba(0,229,204,0.5);
      --text:      #ffffff;
      --text-dim:  rgba(255,255,255,0.6);
      --text-faint:rgba(255,255,255,0.35);
      --card-bg:   rgba(255,255,255,0.04);
      --card-border: rgba(0,229,204,0.2);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; }
    section { padding: 0 20px; }

    /* ── HERO ─────────────────────────────────────────────── */
    .hero {
      position: relative;
      min-height: 62vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 72px 20px 40px;
      overflow: hidden;
    }
    .hero-glow {
      position: absolute;
      pointer-events: none;
      width: 560px; height: 560px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,204,0.14) 0%, transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%, -55%);
    }
    .hero-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }
    .hero-wordmark {
      font-size: clamp(38px, 10vw, 56px);
      font-weight: 900;
      letter-spacing: 0.14em;
      color: var(--teal);
      text-shadow: 0 0 40px rgba(0,229,204,0.45);
      line-height: 1;
      margin-bottom: 14px;
    }
    .hero-subtitle {
      font-size: 15px;
      color: var(--text-dim);
      margin-bottom: 40px;
      max-width: 30ch;
    }

    /* ── DOWNLOAD BUTTON ──────────────────────────────────── */
    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: var(--teal);
      color: #020509;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.2px;
      padding: 19px 24px;
      border-radius: 16px;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(0,229,204,0.25);
      transition: transform .15s, box-shadow .2s;
    }
    .download-btn:hover  { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(0,229,204,0.35); }
    .download-btn:active { transform: translateY(0); }
    .download-btn svg { flex-shrink: 0; }

    .download-caption {
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--text-faint);
      text-align: center;
    }

    /* ── STEPS ────────────────────────────────────────────── */
    .steps-section {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 20px 16px;
    }
    .steps-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      font-weight: 800;
      color: var(--text-faint);
      text-align: center;
      margin-bottom: 22px;
    }
    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .step-card {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 20px 22px;
      transition: border-color .2s, transform .2s;
    }
    .step-card:hover { border-color: var(--card-border); transform: translateY(-2px); }
    .step-num {
      flex-shrink: 0;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(0,229,204,0.08);
      border: 1px solid rgba(0,229,204,0.25);
      color: var(--teal);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800;
    }
    .step-text {
      font-size: 14.5px;
      color: var(--text-dim);
      line-height: 1.55;
      padding-top: 6px;
    }
    .step-text strong { color: var(--text); font-weight: 700; }

    /* ── SOCIAL ───────────────────────────────────────────── */
    .social-section { padding: 48px 20px 40px; display: flex; justify-content: center; }
    .social-row { display: flex; align-items: center; gap: 22px; }
    .social-row a {
      display: flex; align-items: center; justify-content: center;
      color: var(--teal);
      opacity: .85;
      transition: opacity .2s, transform .2s;
    }
    .social-row a:hover { opacity: 1; transform: translateY(-2px); }
    .social-row svg { width: 28px; height: 28px; }

    /* ── FOOTER ───────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 12px 20px 40px;
      font-size: 11.5px;
      color: var(--text-faint);
    }
  </style>
</head>
<body>

  <!-- HERO -->

      <p class="hero-wordmark">ABYSS</p>

  <!-- STEPS -->

    </div>
  </section>

  <!-- SOCIAL -->
  <section class="social-section">

</body>
</html>
